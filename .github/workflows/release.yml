name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: CI
        run: make ci

      - name: Build release
        run: make release

      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_dir="dist/vzctl-${RELEASE_TAG}-darwin-arm64"
          mkdir -p "${package_dir}"
          cp target/release/vzctl "${package_dir}/"
          cp daemon/.build/release/vz-helper "${package_dir}/"
          cp daemon/.build/release/vz-supervisor "${package_dir}/"
          cp README.md "${package_dir}/"
          tar -C dist -czf "dist/vzctl-${RELEASE_TAG}-darwin-arm64.tar.gz" "vzctl-${RELEASE_TAG}-darwin-arm64"
          shasum -a 256 "dist/vzctl-${RELEASE_TAG}-darwin-arm64.tar.gz" > "dist/vzctl-${RELEASE_TAG}-darwin-arm64.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: vzctl-${{ github.ref_name }}-darwin-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
