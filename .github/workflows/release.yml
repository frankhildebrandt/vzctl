name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vzctl-ui/package-lock.json

      - name: CI
        run: make ci

      - name: Build release binaries
        run: make release

      - name: Build UI app
        run: make ui-build

      - name: Package tar.gz / pkg / dmg
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-macos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: vzctl-${{ github.ref_name }}-darwin-arm64
          path: |
            dist/*.tar.gz
            dist/*.pkg
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.pkg \
            dist/*.dmg \
            dist/*.sha256 \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
