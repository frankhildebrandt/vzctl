name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # macOS 26 dyld requires LC_UUID; Go <1.24 omits it → abort trap in tests.
          go-version: "1.26.x"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vzctl-ui/package-lock.json

      - name: Tool versions
        run: |
          rustc --version
          cargo --version
          swift --version
          go version

      - name: Prepare strict X.509 verification
        run: |
          brew install openssl@3
          openssl_prefix="$(brew --prefix openssl@3)"
          "${openssl_prefix}/bin/openssl" version
          printf 'VZCTL_TEST_OPENSSL=%s/bin/openssl\n' "${openssl_prefix}" >> "$GITHUB_ENV"

      - name: CI
        env:
          RUSTFLAGS: "-D warnings"
          SWIFT_FLAGS: "-Xswiftc -warnings-as-errors"
        run: make ci

      - name: Validate and diff edge-dmz reference environment
        shell: bash
        run: |
          set -euo pipefail
          state_dir="${RUNNER_TEMP}/vzctl-edge-dmz"
          mkdir -p "${state_dir}"
          VZCTL_STATE_DIR="${state_dir}" \
            daemon/.build/debug/vz-supervisor serve \
            >"${state_dir}/supervisor.log" 2>&1 &
          supervisor_pid=$!
          cleanup() {
            kill "${supervisor_pid}" 2>/dev/null || true
            wait "${supervisor_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..100}; do
            if [[ -S "${state_dir}/vz.sock" ]]; then
              break
            fi
            if ! kill -0 "${supervisor_pid}" 2>/dev/null; then
              cat "${state_dir}/supervisor.log"
              exit 1
            fi
            sleep 0.1
          done
          test -S "${state_dir}/vz.sock"

          target/debug/vzctl validate -C examples/edge-dmz
          VZCTL_STATE_DIR="${state_dir}" \
            target/debug/vzctl plan -C examples/edge-dmz --format json
          VZCTL_STATE_DIR="${state_dir}" \
            target/debug/vzctl diff -C examples/edge-dmz --format json
