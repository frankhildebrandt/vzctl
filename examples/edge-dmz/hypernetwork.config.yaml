apiVersion: hypernetwork/v1
kind: Environment
metadata:
  name: edge-dmz
spec:
  project: edge-dmz
  domain: edge-dmz.vz.test
  dns:
    enabled: true
    hostResolver: true
    hostListen: "127.0.0.1:15353"
    forward: { enabled: true, upstream: system }
  images:
    ubuntu-base:
      from: ubuntu-latest
      role: base
  networks:
    dmz:
      cidr: 10.80.0.0/24
      mode: shared
    lan:
      cidr: 10.90.0.0/24
      mode: shared
  routes:
    - name: dmz-to-lan
      from: dmz
      to: lan
      via: router
  policies:
    - name: dmz-default
      network: dmz
      forward: deny-all
      allow:
        - { to: lan, proto: tcp, ports: [5432] }
        - { to: dmz, proto: icmp }
  vms:
    router:
      from: ubuntu-base
      clone: linked
      dataDisk: 4G
      roles: [router]
      networks:
        - { name: dmz, ip: 10.80.0.2 }
        - { name: lan, ip: 10.90.0.2 }
      cloudInit: cloud-init/router.yaml
      dependsOn: []
    web:
      from: ubuntu-base
      clone: linked
      dataDisk: 40G
      networks:
        - { name: dmz, ip: 10.80.0.10 }
      cloudInit: cloud-init/web.yaml
      dependsOn: [router]
      roles: []
    database:
      from: ubuntu-base
      clone: linked
      dataDisk: 100G
      networks:
        - { name: lan, ip: 10.90.0.10 }
      cloudInit: cloud-init/database.yaml
      dependsOn: [router]
      roles: [database]
      requires: [guest-agent-v1]
