apiVersion: hypernetwork/v1
kind: Environment
metadata:
  name: edge-dmz
spec:
  project: edge-dmz
  domain: edge-dmz.vz.test
  dns:
    enabled: true
    hostResolver: true
    hostListen: 127.0.0.1:15353
    forward:
      enabled: true
      upstream: system
  images:
    ubuntu-base:
      from: ubuntu-latest
      role: base
  networks:
    dmz:
      cidr: 10.80.0.0/24
      mode: shared
      dhcp: false
      natEgress: true
      backend: vmnet
    lan:
      cidr: 10.90.0.0/24
      mode: shared
      dhcp: false
      # Host-NAT kept on for guest DNS (.0:53). Policies use via: to pin routers.
      # Internet edge path remains dmz (router) via lan-to-internet.
      natEgress: true
      backend: vmnet
    containers:
      cidr: 10.95.0.0/24
      mode: shared
      dhcp: false
      natEgress: false
      backend: docker
  routes:
    - name: dmz-to-lan
      from: dmz
      to: lan
      via: router
    - name: lan-to-containers
      from: lan
      to: containers
      via: docker
  policies:
    - name: dmz-default
      network: dmz
      via: router
      forward: deny-all
      allow:
        - to: lan
          proto: tcp
          ports:
            - 5432
        - to: dmz
          proto: tcp
          ports:
            - 80
    - name: lan-to-containers
      network: lan
      via: docker
      forward: deny-all
      allow:
        - to: containers
          proto: tcp
          ports:
            - 80
            - 443
        - to: containers
          proto: icmp
          ports: []
    - name: lan-to-internet
      network: lan
      via: router
      forward: deny-all
      allow:
        - to: internet
          proto: tcp
          ports:
            - 80
            - 443
    - name: containers-default
      network: containers
      via: docker
      forward: deny-all
      allow:
        - to: lan
          proto: tcp
          ports:
            - 5432
  ports:
    - 8080:web:80
  certs:
    enabled: true
    onRotate: reinject
  ingress:
    enabled: true
    bind: 127.0.0.1
    hostAliases: true
    redirectHttp: true
    routes:
      - host: web.svc.edge-dmz.vz.test
        to: web:80
        requires:
          - oidc
      - host: auth.svc.edge-dmz.vz.test
        to: oidc:5556
  oidc:
    enabled: true
    mode: oidc-simple
    issuer: https://auth.svc.edge-dmz.vz.test
    listen: 127.0.0.1:5556
    clients: auto
    users:
      - username: alice
        email: alice@dev.local
        role: admin
      - username: bob
        email: bob@dev.local
      - username: charlie
        email: charlie@dev.local
  vms:
    router:
      from: ubuntu-base
      clone: linked
      dataDisk: 4G
      networks:
        - name: dmz
          ip: 10.80.0.2
        - name: lan
          ip: 10.90.0.2
      cloudInit: cloud-init/router.yaml
      dependsOn: []
      roles:
        - router
      requires: []
      ports: []
      mounts: []
    web:
      from: ubuntu-base
      clone: linked
      dataDisk: 40G
      networks:
        - name: dmz
          ip: 10.80.0.10
      cloudInit: cloud-init/web.yaml
      dependsOn:
        - router
      roles: []
      requires:
        - oidc
      ports: []
      mounts: []
    docker:
      from: ubuntu-base
      clone: linked
      dataDisk: 100G
      networks:
        - name: lan
          ip: 10.90.0.10
        - name: containers
          ip: 10.95.0.2
      cloudInit: cloud-init/docker.yaml
      dependsOn:
        - router
      roles:
        - docker
        - router
      requires: []
      ports: []
      mounts: []
    host:
      from: ubuntu-base
      clone: linked
      dataDisk: 20G
      cpus: 2
      memory: 2048MiB
      networks:
        - name: lan
          ip: 10.90.0.11
      dependsOn: []
      roles: []
      requires: []
      ports: []
      mounts: []
