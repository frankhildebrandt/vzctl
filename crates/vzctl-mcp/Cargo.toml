[package]
name = "vzctl-mcp"
version = "0.0.1"
edition = "2021"
description = "Model Context Protocol server for vzctl hypercontainers"
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "vzctl-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
