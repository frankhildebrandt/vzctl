[package]
name = "vzctl"
version = "0.0.1"
edition = "2021"
description = "Environments-as-Code CLI for macOS Virtualization (Alpha)"
license = "UNLICENSED"
publish = false

[dependencies]
ctrlc = "3.4"
ipnet = "2.12"
jsonschema = { version = "0.18", default-features = false }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
