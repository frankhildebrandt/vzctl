[package]
name = "vzctl"
version = "0.0.1"
edition = "2021"
description = "Environments-as-Code CLI for macOS Virtualization (Alpha)"
license-file = "../../LICENSE"
publish = false

[dependencies]
base64 = "0.22"
ctrlc = "3.4"
ipnet = "2.12"
jsonschema = { version = "0.18", default-features = false }
libc = "0.2"
pem = "3"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
time = "0.3"
